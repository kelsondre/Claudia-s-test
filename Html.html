<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How this game was made</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--lb:#dfe3f5;--ink:#0d1030;--blue:#2d46ff;--yel:#ffd028;--fd:Anton,Impact,"Arial Narrow",sans-serif;--fb:"Helvetica Neue",Helvetica,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lb:#05060d}}
:root[data-theme="dark"]{--lb:#05060d}
html,body{height:100%;margin:0;background:var(--lb)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#st{position:relative;width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;container-type:inline-size;overflow:hidden;font-family:var(--fb);user-select:none;-webkit-user-select:none;cursor:pointer;--sk:rgba(255,255,255,.14);color:#fff;background:var(--ink)}
#st.k1{background:var(--ink)}#st.k2{background:var(--blue)}#st.k3{background:var(--yel);color:var(--ink);--sk:rgba(13,16,48,.14)}
#cam,#sc{position:absolute;inset:0}
#fl{position:absolute;inset:0;background:#fff;opacity:0;z-index:14;pointer-events:none}
#gr{position:absolute;inset:-10%;z-index:12;pointer-events:none;mix-blend-mode:overlay;opacity:.4;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .5s steps(5) infinite}
#vg{position:absolute;inset:0;z-index:11;pointer-events:none;background:radial-gradient(transparent 55%,rgba(0,0,0,.4))}
#pg{position:absolute;top:0;left:0;height:1cqw;width:0;background:#fff;mix-blend-mode:difference;z-index:15}
#mu{position:absolute;top:3cqw;right:3cqw;z-index:30;width:9cqw;height:9cqw;border-radius:50%;border:0;background:rgba(0,0,0,.35);font-size:4.4cqw;cursor:pointer}
#ov{position:absolute;inset:0;z-index:20;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8cqw;text-align:center}
#ov b{font:400 20cqw/.9 var(--fd);text-transform:uppercase}
#ov span{font:600 4.6cqw var(--fb);background:var(--yel);color:var(--ink);padding:2.4cqw 5cqw;border-radius:6cqw}
#st.pz:after{content:"❚❚  paused";position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:30;background:rgba(0,0,0,.6);color:#fff;padding:2cqw 4cqw;border-radius:3cqw;font:600 5cqw var(--fb)}
.ab{position:absolute;left:7cqw;right:7cqw}
.big{font:400 20cqw/.9 var(--fd);text-transform:uppercase;text-align:left}
.w{display:inline-block;animation:slam .35s cubic-bezier(.2,1.4,.4,1) both}
.hl{background:var(--yel);color:var(--ink);padding:0 .1em;rotate:-2.5deg}
#st.k3 .hl{background:var(--ink);color:var(--yel)}
.cap{position:absolute;left:8cqw;right:8cqw;font:600 5cqw/1.5 var(--fb)}
.mq{position:absolute;left:0;top:var(--y);white-space:nowrap;font:400 42cqw/1 var(--fd);color:transparent;-webkit-text-stroke:.5cqw var(--sk);rotate:-7deg;animation:mqm 3.2s linear infinite;pointer-events:none}
.ph{position:absolute;width:66cqw;height:112cqw;border-radius:9cqw;background:#111;padding:1.6cqw;box-shadow:0 4cqw 10cqw rgba(0,0,0,.5);box-sizing:border-box;transform:perspective(150cqw) rotateY(var(--ry,0deg)) rotate(var(--r,0deg));animation:swing .6s cubic-bezier(.2,1.1,.3,1) both,bobp 3s ease-in-out .6s infinite}
.scr{position:relative;height:100%;border-radius:7.6cqw;background:#faf9f4;color:#111;padding:9cqw 5cqw 0;box-sizing:border-box;overflow:hidden;font:500 4.1cqw/1.35 -apple-system,"SF Pro Text",var(--fb)}
.scr:before{content:"";position:absolute;top:2.2cqw;left:50%;width:18cqw;height:5cqw;margin-left:-9cqw;border-radius:3cqw;background:#111}
.nb{display:flex;justify-content:space-between;color:#d9a400;font-weight:600;margin-bottom:3cqw}
.scr h2{margin:0 0 2.5cqw;font:700 7.2cqw/1.1 -apple-system,var(--fb);min-height:8cqw}
.ck{display:flex;gap:2.5cqw;align-items:flex-start;margin:2.4cqw 0}
.ck i{flex:none;width:4.4cqw;height:4.4cqw;border-radius:50%;border:.5cqw solid #d9a400;margin-top:.5cqw}
.ck.done i{background:#d9a400;box-shadow:inset 0 0 0 .8cqw #faf9f4}
.ty.s:not(.d):after{content:"";display:inline-block;width:.6cqw;height:1em;background:#d9a400;vertical-align:-.15em;margin-left:.4cqw;animation:bl .4s steps(1) infinite}
.cd{position:absolute;left:7cqw;right:7cqw;box-sizing:border-box;background:#0b0e24;color:#e8ecff;border-radius:3cqw;padding:4cqw;font:600 4.3cqw/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;border:.7cqw solid #fff}
.gag{position:absolute;overflow:hidden;border-radius:4cqw;border:.8cqw solid #fff;box-sizing:border-box}
.pp{position:absolute;top:0;bottom:0;left:100%;width:11cqw;background:linear-gradient(#5cb85c 0 34%,transparent 34% 66%,#5cb85c 66%);border-left:.8cqw solid #2f6f2f;border-right:.8cqw solid #2f6f2f;animation:mv 2.2s linear infinite}
.bd{position:absolute;left:18cqw;width:9cqw;height:7cqw;background:#ffd028;border-radius:50%;border:.7cqw solid #8a6d00;box-sizing:border-box;animation:bd 1.1s ease-in-out infinite}
.sky{background:#8ecae6}
.grid{position:absolute;left:-50%;top:34%;width:200%;height:200%;transform:perspective(60cqw) rotateX(68deg);transform-origin:top;background:#6fa85a linear-gradient(#5d9549 .6cqw,transparent .6cqw),linear-gradient(90deg,#5d9549 .6cqw,transparent .6cqw);background-size:8cqw 8cqw;animation:gs .7s linear infinite}
.cb{position:absolute;left:50%;top:40%;width:10cqw;height:10cqw;margin-left:-5cqw;background:#2b6cb0;border-radius:1cqw;box-shadow:0 -8.5cqw 0 -1cqw #f6d55c;animation:bob .35s ease-in-out infinite alternate}
.jy{position:absolute;width:38cqw;height:38cqw;border-radius:50%;border:1cqw solid rgba(255,255,255,.7);background:rgba(255,255,255,.18)}
.jy i{position:absolute;left:50%;top:50%;animation:jx 1.6s ease-in-out infinite alternate}
.jy b{display:block;width:16cqw;height:16cqw;margin:-8cqw 0 0 -8cqw;border-radius:50%;background:#fff;animation:jz 1.6s ease-in-out -.8s infinite alternate}
.chips{display:flex;flex-wrap:wrap;gap:2cqw}
.chip{background:#fff;color:var(--ink);font:700 4.6cqw/1 var(--fb);padding:2cqw 3.2cqw;border-radius:5cqw}
#st.k3 .chip{background:var(--ink);color:var(--yel)}
.sw span{position:absolute;left:0;top:0;animation:sw 1.6s steps(1) infinite}
.sw .fa{opacity:0;animation-name:sw2}
.jt{position:absolute;left:50%;width:14cqw;height:14cqw;margin-left:-7cqw;background:#2b6cb0;border-radius:2cqw;box-shadow:0 -11cqw 0 -2cqw #f6d55c;animation:jt 1.6s infinite}
.jt:before{content:"";position:absolute;left:-4cqw;top:2cqw;width:4cqw;height:9cqw;background:#adb5bd;border-radius:1cqw}
.lv{position:absolute;left:0;right:0;bottom:0;height:12cqw;background:#e63946}
.br{margin-bottom:3.4cqw;font:600 4.4cqw var(--fb)}.br span{display:block;margin-bottom:1cqw}
.bar{height:3.4cqw;border-radius:2cqw;background:rgba(13,16,48,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);animation:gw .7s cubic-bezier(.2,.9,.3,1) var(--d) both}
.bt{font:700 4.8cqw var(--fb);margin-bottom:4cqw}
@keyframes slam{0%{transform:scale(3.2) rotate(-8deg);opacity:0;filter:blur(8px)}55%{opacity:1;filter:none}100%{transform:none}}
@keyframes c1{0%{transform:scale(1.35);filter:drop-shadow(1.6cqw 0 #ff2e63) drop-shadow(-1.6cqw 0 #08d9d6) blur(1.2cqw)}100%{transform:none;filter:none}}
@keyframes c2{0%{transform:translateX(60cqw) skewX(-20deg);filter:blur(2cqw)}100%{transform:none;filter:none}}
@keyframes c3{0%{transform:scale(.7) rotate(8deg);opacity:0}30%{opacity:1;transform:translate(-3cqw,2cqw) scale(1.1)}60%{transform:translate(2cqw,-1cqw)}100%{transform:none}}
.c1{animation:c1 .4s ease-out}.c2{animation:c2 .35s cubic-bezier(.2,.8,.2,1)}.c3{animation:c3 .4s ease-out}
@keyframes pump{0%{transform:scale(1.028)}100%{transform:none}}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
@keyframes gr{0%{translate:0 0}25%{translate:-4% 3%}50%{translate:3% -5%}75%{translate:-2% 4%}100%{translate:5% 1%}}
@keyframes swing{from{transform:translateY(90cqw) perspective(150cqw) rotateY(40deg) rotate(20deg);opacity:0}}
@keyframes bobp{50%{translate:0 -2.5cqw}}
@keyframes mqm{to{translate:-50% 0}}
@keyframes bl{50%{opacity:0}}
@keyframes mv{to{translate:-110cqw 0}}
@keyframes bd{0%,100%{top:34cqw}50%{top:22cqw}}
@keyframes gs{to{background-position:0 8cqw}}
@keyframes bob{to{translate:0 -3cqw}}
@keyframes jx{from{translate:-9cqw 0}to{translate:9cqw 0}}
@keyframes jz{from{translate:0 -9cqw}to{translate:0 9cqw}}
@keyframes sw{0%{opacity:1}50%{opacity:0}}
@keyframes sw2{0%{opacity:0}50%{opacity:1}}
@keyframes jt{0%{top:99cqw}15%{top:95cqw}30%{top:99cqw}45%{top:95cqw}50%{top:98cqw;animation-timing-function:ease-in}100%{top:172cqw}}
@keyframes gw{to{width:var(--w)}}
@media (prefers-reduced-motion:reduce){#gr,#fl{display:none}}
</style>
</head>
<body>
<div id="st" class="k1">
<div id="cam"><div id="sc"></div></div>
<div id="pg"></div><div id="fl"></div><div id="gr"></div><div id="vg"></div>
<button id="mu" type="button" aria-label="Mute">🔊</button>
<div id="ov"><b>How this<br>game was<br>made</b><span>▶ tap to play · sound on</span></div>
</div>
<script>
const $=id=>document.getElementById(id),st=$('st'),cam=$('cam'),sc=$('sc'),fl=$('fl'),pg=$('pg'),ov=$('ov'),mu=$('mu');
const W=(t,d=0,c='')=>`<span class="w ${c}" style="animation-delay:${d}s">${t}</span>`;
const T_=(t,d,c=42)=>`<span class="ty" data-t="${t}" data-d="${d}" data-c="${c}"></span>`;
const L=(t,d)=>`<div class="ck"><i></i>${T_(t,d)}</div>`;
const B=(h,s,p)=>`<div class="big ab" style="font-size:${s}cqw;${p}">${h}</div>`;
const PH=(ti,body,s)=>`<div class="ph" style="${s}"><div class="scr"><div class="nb"><span>‹ Notes</span><span>⋯</span></div><h2>${T_(ti,.2,30)}</h2>${body}</div></div>`;
const MQ=(t,y)=>`<div class="mq" style="--y:${y}cqw">${(t+' ').repeat(8)}</div>`;
const CD=(t,d,s)=>`<div class="cd" style="${s}">${T_(t,d,48)}</div>`;
const CAP=(t,d,s)=>`<div class="cap" style="${s}">${T_(t,d,45)}</div>`;
const BR=(l,w,d)=>`<div class="br"><span>${l}</span><div class="bar"><i style="--w:${w}%;--d:${d}s"></i></div></div>`;
const SC=[
{n:6,k:1,h:MQ('CLAUDE',58)+B(W('ONE',0)+' '+W('SENTENCE',.3)+'<br>'+W('→',.7)+'<br>'+W('A 3D GAME',.95,'hl'),20,'top:34cqw')+CAP('made with Claude · here’s how',1.5,'bottom:16cqw;text-align:center')},
{n:10,k:2,h:MQ('PROMPTS',70)+B(W('3 PROMPTS',0),19,'top:9cqw')+PH('how it was made',L('1  flappy bird (2D)',1)+L('2  3D baseplate + joystick',1.7)+L('3  long obby + jetpack',2.5)+L('each = 1 prompt, 1 file',3.2),'left:17cqw;top:42cqw;--r:-4deg;--ry:-10deg')},
{n:6,k:3,h:MQ('FILE',60)+B(W('ONE FILE.',0)+'<br>'+W('ZERO',.35,'hl')+'<br>'+W('ASSETS.',.6),22,'top:30cqw')+CAP('just HTML + JS · three.js from a CDN for 3D',1.2,'bottom:18cqw;text-align:center')},
{n:8,k:1,h:B(W('THE BIRD',0),19,'top:7cqw')+'<div class="gag" style="left:8cqw;top:30cqw;width:84cqw;height:58cqw;background:#70c5ce"><div class="pp"></div><div class="pp" style="animation-delay:-1.1s"></div><div class="bd"></div></div>'+PH('flappy bird',L('canvas · 360×560',1)+L('gravity + flap = physics',1.8)+L('pipes = random gaps',2.6),'left:15cqw;top:96cqw;--r:2deg;width:70cqw')},
{n:8,k:3,h:MQ('PHYSICS',64)+B(W('GRAVITY',0)+'<br>'+W('= 2 LINES',.35,'hl'),19,'top:14cqw')+CD('bird.v += 0.45;\nbird.y += bird.v;\n// tap → bird.v = -7.4',.9,'top:78cqw')+CAP('that’s the whole flappy physics',1.7,'bottom:20cqw;text-align:center')},
{n:8,k:2,h:MQ('3D',50)+B(W('THEN',0)+'<br>'+W('3D',.3,'hl'),24,'top:8cqw')+'<div class="cap" style="top:54cqw;font-size:4.6cqw">'+T_('baseplate = 1 big box',.8)+'<br>'+T_('studs = texture drawn in code',1.4)+'<br>'+T_('player = a stack of boxes',2.0)+'</div><div class="gag sky" style="left:0;top:80cqw;width:100cqw;height:100cqw;border:0;border-radius:0"><div class="grid"></div><div class="cb"></div></div>'},
{n:8,k:1,h:MQ('MOVE',56)+B(W('JOYSTICK',0),21,'top:8cqw')+'<div class="jy" style="left:6cqw;top:92cqw"><i><b></b></i></div>'+PH('controls',L('drag knob → direction',1)+L('moves relative to camera',1.8)+L('drag scene → look around',2.6),'left:45cqw;top:50cqw;--r:6deg;--ry:14deg;width:58cqw')},
{n:8,k:2,h:MQ('OBBY',62)+B(W('A LONG',0)+'<br>'+W('OBBY',.3,'hl'),22,'top:8cqw')+CD('for (i = 0; i < 10; i++) {\n  z -= 7.5;\n  P(sin(i*2.3)*3, y, z, 4, 4);\n}',.8,'top:60cqw')+'<div class="chips ab" style="top:112cqw">'+W('6 CHECKPOINTS',2.4,'chip')+W('LAVA',2.7,'chip')+W('SPINNING BAR',3,'chip')+W('MOVING PLATFORMS',3.3,'chip')+'</div>'},
{n:8,k:3,h:CD('ON  → vy → 0       // float\nOFF → vy += gravity // fall',.4,'top:8cqw')+'<div class="big ab sw" style="font-size:38cqw;top:30cqw;height:36cqw"><span class="fl">FLOAT</span><span class="fa">FALL</span></div><div class="cap" style="top:72cqw;text-align:center">jetpack on = gravity off</div><div class="jt"></div><div class="lv"></div>'},
{n:6,k:1,h:MQ('HONEST',60)+B(W('CAVEAT',0,'hl'),24,'top:12cqw')+PH('untested',L('written in one pass',.9)+L('never actually played',1.5)+L('jump tuning = guesses',2.1)+L('may need tweaks',2.7),'left:17cqw;top:48cqw;--r:3deg;--ry:-8deg')},
{n:4,k:2,h:B(W('COULD',0)+'<br>'+W('OTHER AIs',.3,'hl')+'<br>'+W('DO IT?',.65),21,'top:44cqw')},
{n:12,k:3,h:'<div class="ab" style="top:10cqw"><div class="bt">difficulty · my guess</div>'+BR('2D flappy',30,.3)+BR('3D + joystick',58,.7)+BR('long obby + jetpack, no bugs',88,1.1)+'</div>'+PH('honest take',L('probably yes ✅',1.4)+L('single-file games = very common',2.3)+L('hard part = works first try',3.4)+L('not tested on other AIs',4.1),'left:15cqw;top:70cqw;--r:-2deg;width:70cqw')},
{n:6,k:2,h:MQ('YOUR TURN',58)+B(W('3 PROMPTS.',0)+'<br>'+W('3 GAMES.',.35)+'<br>'+W('YOUR TURN.',.7,'hl'),18,'top:40cqw')+CAP('try the same prompts on any AI · compare',1.4,'bottom:20cqw;text-align:center')}
];
// ---- sound ----
const BEAT=.4;let ac,NB,mute=false;
function tone(ty,f0,f1,t,d,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function nz(ty,f0,f1,t,d,v){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NB;f.type=ty;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+d)}
function beat(b){
  cam.style.animation='none';void cam.offsetWidth;cam.style.animation='pump .3s ease-out';
  if(!ac||mute)return;const t=ac.currentTime+.02;
  tone('sine',170,45,t,.22,.9);
  if(b%2)nz('bandpass',1800,1800,t,.12,.5);
  nz('highpass',7000,7000,t+BEAT/2,.05,.25);
  const n=[55,55,65.4,49][(b>>1)&3];tone('sawtooth',n,n,t+BEAT/2,.18,.16);
}
// ---- timeline ----
let T=0,run=false,pz=false,cur=-1,lastB=-1,prev=0,tys=[];
const starts=[];let TOTAL=0;SC.forEach(s=>{starts.push(TOTAL);TOTAL+=s.n*BEAT});
function enter(i){
  cur=i;sc.innerHTML=SC[i].h;st.classList.remove('k1','k2','k3');st.classList.add('k'+SC[i].k);
  tys=[...sc.querySelectorAll('.ty')];
  sc.className='';void sc.offsetWidth;sc.className='c'+(i%3+1);
  fl.style.animation='none';void fl.offsetWidth;fl.style.animation='fl .3s ease-out';
  if(ac&&!mute){const t=ac.currentTime;nz('bandpass',250,5000,t,.3,.6);tone('sine',100,28,t,.4,.8)}
}
function frame(now){
  const dt=Math.min((now-prev)/1000,.1);prev=now;
  if(run&&!pz){
    T+=dt;
    if(T>=TOTAL){run=false;ov.innerHTML='<b>Replay</b><span>↻ tap to watch again</span>';ov.style.display='flex'}
    else{
      let i=0;while(i+1<starts.length&&starts[i+1]<=T)i++;
      if(i!==cur)enter(i);
      const b=Math.floor(T/BEAT);if(b!==lastB){lastB=b;beat(b)}
      const lt=T-starts[i];
      tys.forEach(e=>{
        const s=e.dataset.t,n=Math.max(0,Math.min(s.length,Math.floor((lt-e.dataset.d)*e.dataset.c)));
        if(n!==e._n){e._n=n;e.textContent=s.slice(0,n);e.classList.toggle('s',n>0);
          if(n===s.length){e.classList.add('d');e.parentNode.classList.add('done')}else e.classList.remove('d');
          if(ac&&!mute&&n&&n%3===0)tone('square',1600,1600,ac.currentTime,.02,.025)}
      });
      pg.style.width=T/TOTAL*100+'%';
    }
  }
  requestAnimationFrame(frame);
}
function start(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate;NB=ac.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
  T=0;cur=-1;lastB=-1;pz=false;st.classList.remove('pz');run=true;ov.style.display='none';
}
ov.onclick=e=>{e.stopPropagation();start()};
st.onclick=()=>{if(!run)return;pz=!pz;st.classList.toggle('pz',pz);if(ac)pz?ac.suspend():ac.resume()};
mu.onclick=e=>{e.stopPropagation();mute=!mute;mu.textContent=mute?'🔇':'🔊'};
requestAnimationFrame(frame);
</script>
</body>
</html>
